<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title><meta name="description" content="__DESC__">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script defer src="/_vercel/insights/script.js"></script>
__ANALYTICS__
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?__FONTS__&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{__LIGHT__ --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){__DARK__ color-scheme:dark}}
:root[data-theme="dark"]{__DARK__ color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0;--pw-bg:var(--bg);--pw-ink:var(--ink);--pw-soft:var(--muted);--pw-line:var(--rule);--pw-card:var(--panel);--pw-accent:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:var(--h1w) clamp(30px,6vw,50px)/1.05 var(--display);margin:10px 0 12px;text-wrap:balance;letter-spacing:-.01em;max-width:20ch}
.lede{font-size:18px;max-width:60ch;margin:0;color:var(--ink2)}
.lede b{color:var(--ink);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:22px 0 6px;font-variant-numeric:tabular-nums}
.stat b{display:block;font:600 26px/1.1 var(--display);color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px}
@media(min-width:860px){.grid{grid-template-columns:340px 1fr;align-items:start}.mapbox{position:sticky;top:12px}}
@media(max-width:859px){.mapbox{order:2}}
.mapbox{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px}
.mapbox svg{display:block;width:100%;height:auto;max-height:70vh}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px/1 var(--body);border:1px solid var(--rule);background:var(--bg);color:var(--ink2);padding:11px 12px;border-radius:999px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.chip:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
select,.btn{font:500 16px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;min-height:44px}
select{-webkit-appearance:none;appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.btn{cursor:pointer;text-decoration:none;display:inline-block}
.count{font:12px var(--mono);color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li.r{padding:14px 2px;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
li .a{font-weight:600;font-size:16px}
li .m{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
li .w{grid-column:1/-1;font-size:14px;color:var(--ink2);margin:2px 0}
li .k{grid-column:1/-1;font-size:14px;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 14px}
li .k a{color:var(--accent);font-weight:600;text-decoration:none}
.tag{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;border-radius:4px;white-space:nowrap;align-self:start;background:var(--tagbg);color:var(--tagfg)}
.tag.hot{background:var(--hotbg);color:var(--hotfg)}
.more{margin:14px 0 0}
.note{font-size:13px;color:var(--muted);max-width:65ch;margin-top:36px;border-top:1px solid var(--rule);padding-top:14px}
.note p{margin:0 0 8px}
.free{font-size:13px;color:var(--muted);margin:10px 0 0}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">__EYEBROW__</div>
  <h1>__H1__</h1>
  <p class="lede">__LEDE__</p>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="mapbox"><svg id="map" viewBox="0 0 300 400" role="img" aria-label="__MAPLABEL__"></svg><div class="legend" id="legend"></div></div>
    <div>
      <div class="controls">
        <div class="chips" id="chips"></div>
        <div class="row2"><label class="count" for="sort">Sort <select id="sort"></select></label>
          <button class="btn" id="csv" type="button">Download spreadsheet</button></div>
        <div class="count" id="count"></div>
      </div>
      <ol id="list"></ol>
      <div id="lock"></div>
      <button class="btn more" id="more" type="button" hidden>Show more</button>
      <div id="pay"></div>
    </div>
  </div>
  <div class="note">__NOTE__</div>
</div>
<script src="/paywall.js"></script>
<script>
const CFG=__CFG__;
const FREE=__FREE__;
const $=id=>document.getElementById(id);
let ROWS=FREE.rows,FULL=false,sel=null,shown=40;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d?new Date(d.slice(0,10)+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
$("stats").innerHTML=CFG.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
$("legend").innerHTML=CFG.legend.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join("");
// chips count the WHOLE list (FREE.counts), not just the sample
function chips(){const C=FULL?Object.fromEntries(CFG.chipOrder.map(g=>[g,ROWS.filter(r=>r[CFG.chipKey]===g).length])):FREE.counts;
  $("chips").innerHTML=[["All",FREE.total],...CFG.chipOrder.filter(g=>C[g]).map(g=>[g,C[g]])].map(([g,n])=>`<button class="chip" type="button" data-g="${esc(g)}" aria-pressed="${(g==="All"&&!sel)||g===sel}">${esc(g)} · ${n}</button>`).join("")}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;sel=b.dataset.g==="All"?null:b.dataset.g;shown=40;chips();render();Paywall.track("filter",{g:sel||"All"})};
$("sort").innerHTML=CFG.sorts.map(([k,l,paid])=>`<option value="${k}">${esc(l)}${paid&&!FULL?" (full list)":""}</option>`).join("");
// map: every row is a dot (FREE.dots carries all of them, rounded), the sample is drawn on top
const D=FREE.dots;const la=D.map(d=>d[0]),lo=D.map(d=>d[1]);
const pad=.006,B={n:Math.max(...la)+pad,s:Math.min(...la)-pad,w:Math.min(...lo)-pad,e:Math.max(...lo)+pad};
const kx=Math.cos((B.n+B.s)/2*Math.PI/180),W=300,H=Math.round(W*(B.n-B.s)/((B.e-B.w)*kx));
$("map").setAttribute("viewBox",`0 0 ${W} ${H}`);
const px=(lat,lon)=>[(lon-B.w)/(B.e-B.w)*W,(B.n-lat)/(B.n-B.s)*H];
function map(rows){
  let s=`<rect width="${W}" height="${H}" fill="var(--panel)"/>`;
  if(CFG.river)s+=`<polyline points="${CFG.river.map(p=>px(p[0],p[1]).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--water)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
  const on=new Set(rows);
  if(FULL){s+=ROWS.map(r=>{const [x,y]=px(r.lat,r.lon),o=on.has(r);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${o?2.6:1.6}" fill="${o?CFG.color(r):"var(--ghost)"}" opacity="${o?.9:.5}"/>`}).join("")}
  else{s+=D.map(d=>{const [x,y]=px(d[0],d[1]),o=!sel||CFG.chipOrder[d[2]]===sel;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${o?2.4:1.5}" fill="${o?CFG.dotColor[d[2]]:"var(--ghost)"}" opacity="${o?.85:.5}"/>`}).join("")}
  for(const l of (CFG.labels||[])){const [x,y]=px(l[0],l[1]);s+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="10" fill="var(--muted)" font-family="var(--body)" text-anchor="middle">${esc(l[2])}</text>`}
  $("map").innerHTML=s;
}
function filtered(){const r=ROWS.filter(x=>!sel||x[CFG.chipKey]===sel);const k=$("sort").value;return (CFG.sortFn[k]||CFG.sortFn[CFG.sorts[0][0]])(r.slice())}
function row(r){return `<li class="r"><span class="a">${esc(CFG.title(r))}</span>${CFG.tag(r)}<span class="w">${esc(CFG.what(r)||"")}</span>${FULL&&CFG.paid?`<span class="k">${CFG.paid(r)}</span>`:""}<span class="m">${CFG.meta(r).filter(Boolean).map(esc).map(x=>`<span>${x}</span>`).join("")}</span></li>`}
function render(){
  const rows=filtered();map(rows);
  const tot=FULL?rows.length:(sel?FREE.counts[sel]||0:FREE.total);
  $("count").textContent=FULL?`Showing ${Math.min(shown,rows.length)} of ${rows.length}`:`${rows.length} of ${tot} open to look at, no login`;
  $("list").innerHTML=rows.slice(0,FULL?shown:99).map(row).join("");
  $("more").hidden=!FULL||shown>=rows.length;
  $("lock").innerHTML=FULL?"":Paywall.lockRow(CFG.lockText(tot-rows.length));
}
$("more").onclick=()=>{shown+=60;render()};
let lastSort=$("sort").value;
$("sort").onchange=()=>{const s=CFG.sorts.find(x=>x[0]===$("sort").value);if(s&&s[2]&&!FULL){$("sort").value=lastSort;Paywall.track("lock_click",{what:"sort"});Paywall.go();return}lastSort=$("sort").value;shown=40;render();Paywall.track("sort",{k:lastSort})};
$("csv").onclick=()=>{
  if(!FULL){Paywall.track("lock_click",{what:"csv"});Paywall.go();return}
  const rows=filtered(),q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const t=[CFG.cols.map(c=>q(c[1])).join(","),...rows.map(r=>CFG.cols.map(c=>q(r[c[0]])).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=CFG.csv;document.body.appendChild(a);a.click();a.remove();
  Paywall.track("download",{rows:rows.length});
};
chips();render();
Paywall.track("preview_open",{path:location.pathname});
Paywall.init({slot:$("pay"),ctx:{path:location.pathname},onUnlock:(d)=>{ROWS=d.rows;FULL=true;
  $("sort").innerHTML=CFG.sorts.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("");
  const p=CFG.sorts.find(s=>s[2]);if(p){$("sort").value=p[0];lastSort=p[0]}
  shown=40;chips();render()}}).then(()=>{if(!FULL)render()});
</script>
</body></html>
